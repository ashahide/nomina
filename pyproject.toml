[project]
name = "nomina"
version = "0.1.0"
description = "A Python command line tool for checking Python library name availability"
authors = [
    {name = "ashahide",email = "anshahidehpour@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest (>=8.4.2,<9.0.0)",
    "requests (>=2.32.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
